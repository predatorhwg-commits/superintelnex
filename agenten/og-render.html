<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OG-Image SuperIntelNex</title>
<style>
  html,body{margin:0;padding:0;background:#000}
  #og{display:block;background:#000}
</style>
</head>
<body>
<canvas id="og" width="1200" height="630" aria-label="SuperIntelNex — KI und digitale Zahlungen"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('og');
  const ctx = canvas.getContext('2d');
  const W = 1200, H = 630;

  // Deterministischer Zufallsgenerator (LCG), damit das Bild stabil ist.
  let seed = 349112;
  function random() {
    seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Punktring im Stil des Canvas-Artefakts (FIG. 01 / RING):
  // weiße Rechteck-Partikel, 3D-umgesetzter Ring, Helligkeit je nach Tiefe.
  const cx = 850, cy = H * .51;
  const scale = 205;
  const total = 1600;
  const tau = Math.PI * 2;
  const spin = .5;
  const xAngle = .84, zAngle = -.39;
  const sx = Math.sin(xAngle), ax = Math.cos(xAngle), sz = Math.sin(zAngle), az = Math.cos(zAngle);
  const paths = Array.from({length: 8}, () => []);

  for (let i = 0; i < total; i++) {
    const a = random() * tau, b = random() * tau, c = random(), d = random(), e = random();
    const scatter = c > .93, spread = scatter ? 1.12 + d * 1.4 : Math.sqrt(d);
    const tube = (.12 + .035 * Math.cos(a * 3)) * spread;
    const r = .83 + tube * Math.cos(b) + .035 * Math.sin(2 * a);
    let x = r * Math.cos(a), y = r * Math.sin(a), z = tube * Math.sin(b);
    const angle = spin + .026 * Math.sin(.7 + b);
    const u = x * Math.cos(angle) - y * Math.sin(angle);
    const w = x * Math.sin(angle) + y * Math.cos(angle);
    const q = w * ax - z * sx;
    z = w * sx + z * ax; x = u * az - q * sz; y = u * sz + q * az;
    const light = clamp(.24 + .27 * z + e * .43 - (scatter ? .25 : 0), .07, .99);
    const bin = Math.floor(light * paths.length);
    const persp = 3.35 / (3.35 - z);
    const px = cx + x * scale * persp, py = cy + y * scale * persp;
    const radius = (3 + e * 9) * persp;
    paths[bin].push(px, py, radius);
  }
  ctx.fillStyle = '#fff';
  for (let k = 0; k < paths.length; k++) {
    const data = paths[k];
    if (!data.length) continue;
    ctx.globalAlpha = .12 + k * .125;
    ctx.beginPath();
    for (let j = 0; j < data.length; j += 3) {
      const r = data[j + 2];
      ctx.rect(data[j] - r / 2, data[j + 1] - r / 2, r, r);
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Textblock links, im Codex-Look der Site (Eyebrow + Titel + Subline).
  const left = 84;
  ctx.fillStyle = '#b3b3b3';
  ctx.font = '500 15px ui-monospace, SFMono-Regular, Consolas, monospace';
  const eyebrow = 'COMMUNITY-TOKEN-PROJEKT IM AUFBAU';
  ctx.fillText(eyebrow, left, 235);
  const eW = ctx.measureText(eyebrow).width;
  ctx.fillRect(left, 258, Math.min(eW * .45, 110), 1);

  ctx.fillStyle = '#f0f0f0';
  ctx.font = '700 64px Arial, Helvetica, sans-serif';
  ctx.fillText('SuperIntelNex —', left, 345);

  ctx.font = '700 40px Arial, Helvetica, sans-serif';
  ctx.fillStyle = '#bfbfbf';
  ctx.fillText('KI und digitale Zahlungen', left, 402);

  ctx.fillStyle = '#8a8a8a';
  ctx.font = '500 14px ui-monospace, SFMono-Regular, Consolas, monospace';
  ctx.fillText('FIG. 01 / RING  —  superintelnex.com', left, 505);
})();
</script>
</body>
</html>
