  *{box-sizing:border-box}

  p{margin:0}
  a{color:var(--ink)}
  footer{min-height:83px;border-top:1px solid var(--line)}
  .caption{display:flex;align-items:center;gap:10px;margin-inline:var(--edge);min-height:83px;color:var(--muted);font:10px var(--mono);letter-spacing:.15em}
  .caption svg{width:15px;color:var(--ink)}
  .caption-note{display:inline}
  @media(max-width:560px){
    header{height:auto;min-height:84px;display:grid;grid-template-columns:1fr auto;align-content:center}
    .brand{font-size:16px}.brand svg{width:26px;height:26px}
    nav{grid-column:1/-1;justify-content:flex-start;gap:24px}
